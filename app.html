:root{--bg:#0f1226;--card:#1b1f3b;--card2:#242a52;--txt:#f2f3fb;--mut:#a8adcf;--acc:#3ddc84;--acc2:#6c8cff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -200px,#2c3478 0,var(--bg) 70%) fixed;color:var(--txt)}
header{text-align:center;padding:48px 16px 24px}
header img{width:64px;height:64px}
h1{margin:12px 0 6px;font-size:clamp(26px,6vw,40px)}
header p{margin:0;color:var(--mut);font-size:17px}
.all{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:999px;background:var(--acc);color:#08210f;font-weight:700;text-decoration:none}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 16px;background:rgba(15,18,38,.85);backdrop-filter:blur(8px)}
nav button{border:1px solid #3a4180;background:transparent;color:var(--txt);padding:8px 16px;border-radius:999px;font-size:15px;cursor:pointer}
nav button.on{background:var(--acc2);border-color:var(--acc2)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:28px 4px 14px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
a.app{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 12px;border-radius:18px;background:var(--card);color:var(--txt);text-decoration:none;transition:transform .15s,background .15s}
a.app:hover{transform:translateY(-4px);background:var(--card2)}
a.app img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.n{font-weight:700;font-size:16px}
.d{color:var(--mut);font-size:13px;line-height:1.3}
.get{margin-top:auto;font-size:13px;font-weight:700;color:var(--acc)}
footer{text-align:center;color:var(--mut);font-size:14px;padding:40px 16px}
footer a{color:var(--mut)}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}a.app img{width:72px;height:72px}}
</style>
